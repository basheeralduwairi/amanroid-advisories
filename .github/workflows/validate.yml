name: Validate advisory feed

on:
  push:
    branches: [main]
    paths:
      - 'advisories.json'
      - 'countries.json'
      - 'feeds/**'
      - 'schema.json'
      - 'schemas/**'
      - 'security/**'
      - 'directory/**'
      - 'emergency/**'
      - 'index.html'
      - 'images/**'
      - 'scripts/**'
      - 'tests/**'
      - 'requirements-dev.txt'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'advisories.json'
      - 'countries.json'
      - 'feeds/**'
      - 'schema.json'
      - 'schemas/**'
      - 'security/**'
      - 'directory/**'
      - 'emergency/**'
      - 'index.html'
      - 'images/**'
      - 'scripts/**'
      - 'tests/**'
      - 'requirements-dev.txt'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependency
        run: python -m pip install --requirement requirements-dev.txt
      - name: Validate public feed
        run: python scripts/validate_feed.py
      - name: Validate multi-country manifest and feeds
        run: python scripts/validate_multicountry.py
      - name: Validate public security data
        run: python scripts/validate_security_data.py
      - name: Validate official directory
        run: python scripts/validate_directory.py
      - name: Validate emergency guidance
        run: python scripts/validate_emergency.py
      - name: Run pipeline tests
        run: python -m unittest discover -s tests -v
